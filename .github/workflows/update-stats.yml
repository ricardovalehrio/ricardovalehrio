name: Atualizar Cards de Status

on:
  schedule:
    # Executa a rotina automaticamente todos os dias à meia-noite (UTC)
    - cron: "0 0 * * *"
  # Permite que você execute a automação manualmente clicando num botão
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_STATS }}

      - name: Gerar Card de Status
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=ricardovalehrio&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true'
          path: stats.svg
          token: ${{ secrets.PAT_STATS }}

      - name: Gerar Card de Linguagens
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=ricardovalehrio&layout=compact&langs_count=6&theme=tokyonight'
          path: top-langs.svg
          token: ${{ secrets.PAT_STATS }}

      - name: Commitar e Salvar Imagens Geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg
          git commit -m "chore: atualização automática das métricas do GitHub" || exit 0
          git push
